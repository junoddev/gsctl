name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # GLib headers to build; dbus-run-session, dconf-service, the dconf CLI
      # and glib-compile-schemas for the hermetic tests (tests/common/mod.rs).
      - name: Install GLib and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libglib2.0-bin dbus dconf-service dconf-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: test on MSRV (1.92)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install GLib and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libglib2.0-bin dbus dconf-service dconf-cli
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  distros:
    name: test on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            install: >-
              dnf install -y --setopt=install_weak_deps=False gcc pkgconf-pkg-config
              glib2-devel dbus-daemon dbus-tools dconf util-linux findutils
          - name: Arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm --needed base-devel glib2 glib2-devel dbus dconf util-linux
    steps:
      - name: Install GLib and test dependencies
        run: ${{ matrix.install }}
      - uses: actions/checkout@v6
      # As a normal user: some tests check file ownership and permissions.
      - name: Test as an unprivileged user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c 'curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
            && . ~/.cargo/env && cd "'"$GITHUB_WORKSPACE"'" && cargo test --locked'
