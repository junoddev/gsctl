name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # GLib headers to build; dbus-run-session, dconf-service, the dconf CLI
      # and glib-compile-schemas for the hermetic tests (tests/common/mod.rs).
      - name: Install GLib and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libglib2.0-bin dbus dconf-service dconf-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: test on MSRV (1.92)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GLib and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libglib2.0-bin dbus dconf-service dconf-cli
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
