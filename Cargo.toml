[package]
name = "gsctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Search, inspect and change GNOME settings (GSettings/dconf) with JSON output, validation and undo, built for AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/junoddev/gsctl"
homepage = "https://github.com/junoddev/gsctl"
readme = "README.md"
keywords = ["gnome", "gsettings", "dconf", "cli", "desktop"]
categories = ["command-line-utilities", "config"]
include = [
    "/src/**",
    "/tests/**",
    "/skills/**",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE-*",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
gio = "0.22.10"
glib = "0.22.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
